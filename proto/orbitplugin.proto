syntax = "proto3";

package orbitplugin;

option go_package = "github.com/pedronsg/solastat-template/proto/gen;orbitpluginpb";

// PluginHub is implemented by the core app (e.g. solastat-omie) and consumed
// by every plugin (e.g. solastat-relay). It runs on a local Unix domain
// socket — never exposed off-device — so the transport itself carries no
// TLS; authorization is enforced at the application layer by Register.
service PluginHub {
  // Register is the first call a plugin makes, and it repeats it
  // periodically. The core never verifies a license key itself — it only
  // stores whatever the user pastes into Settings (opaque to the core) and
  // hands the raw pool back in every RegisterResponse. Each plugin checks
  // that pool against its own ID and independently-computed device hash
  // (see solastat-auth) and reports the verdict back via Authorized on its
  // *next* call — the core only ever displays what the plugin told it, it
  // never decides authorization. A plugin that hasn't verified a key naming
  // itself must not start its automation loop.
  rpc Register(RegisterRequest) returns (RegisterResponse);

  // SubscribeSolarData streams every poll-cycle snapshot from the core's
  // Modbus poller, for as long as the plugin stays connected.
  rpc SubscribeSolarData(SubscribeRequest) returns (stream SolarSnapshot);

  // ReadRegisters / WriteRegister proxy to the core's single Modbus/RS485
  // connection — the core is the only process allowed to own the bus.
  rpc ReadRegisters(ReadRegistersRequest) returns (ReadRegistersResponse);
  rpc WriteRegister(WriteRegisterRequest) returns (WriteRegisterResponse);
}

message RegisterRequest {
  string plugin_id = 1;       // e.g. "relay", "gridcharge"
  string plugin_version = 2;
  bool authorized = 3;        // this plugin's own verified verdict, for Settings display only
}

message RegisterResponse {
  repeated string keys = 1;   // every raw key pasted into Settings so far, opaque to the core
}

message SubscribeRequest {}

message Reading {
  double value = 1;
  string unit = 2;
  string label = 3;
}

message SolarSnapshot {
  int64 ts_unix_ms = 1;
  string error = 2;
  map<string, Reading> readings = 3;
}

message ReadRegistersRequest {
  uint32 slave_id = 1;
  uint32 fc = 2;
  uint32 address = 3;
  uint32 count = 4;
}

message ReadRegistersResponse {
  repeated uint32 regs = 1;
  string error = 2;
}

message WriteRegisterRequest {
  uint32 slave_id = 1;
  uint32 address = 2;
  uint32 value = 3;
}

message WriteRegisterResponse {
  string error = 1;
}
